name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Swift 6, macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build -v

      - name: Verify localization
        run: swift run Pesty --verify-localization

      - name: Verify history Settings
        run: swift run Pesty --verify-history-settings

      - name: Verify translation and explanation
        run: swift run Pesty --verify-translation

      - name: Verify local image OCR translation
        run: scripts/test_image_translation.sh .build/debug/Pesty

      - name: Verify iCloud image loading UI
        run: scripts/test_icloud_image_loading.sh .build/debug/Pesty

      - name: Verify iCloud history loading UI
        run: scripts/test_icloud_store_loading.sh .build/debug/Pesty

      - name: Verify deletion survives stale sync snapshots
        run: scripts/test_deletion_sync.sh .build/debug/Pesty

      - name: Verify incremental sync compaction and image cleanup
        run: scripts/test_incremental_sync.sh .build/debug/Pesty

      - name: Verify panel presentation does not wait for reconciliation
        run: scripts/test_panel_reconciliation.sh .build/debug/Pesty

      - name: Verify system appearance
        run: swift run Pesty --verify-appearance

      - name: Verify Settings recovery
        run: swift run Pesty --verify-settings-access

      - name: Verify updater contract
        run: swift run Pesty --verify-updater

      - name: Verify release memory performance
        run: |
          swift build -c release
          scripts/test_memory_performance.sh .build/release/Pesty

      - name: Build and verify release package
        run: |
          VERSION=0.0.0 BUILD="${GITHUB_RUN_NUMBER}" ./scripts/release_build.sh
          ./scripts/verify_release.sh 0.0.0

      - name: Verify generated Homebrew cask
        run: |
          SHA256="$(shasum -a 256 packaging/Pesty-0.0.0.dmg | awk '{print $1}')"
          ./scripts/generate_cask.sh 0.0.0 "$SHA256"
          ruby -c packaging/pesty.rb

      - name: Check shell scripts
        run: |
          brew install shellcheck
          shellcheck scripts/*.sh

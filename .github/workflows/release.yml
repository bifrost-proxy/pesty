name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate stable release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit reachable from origin/main"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify localization
        run: swift run Pesty --verify-localization

      - name: Verify Settings recovery
        run: swift run Pesty --verify-settings-access

      - name: Build ad-hoc signed release
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD: ${{ github.run_number }}
        run: ./scripts/release_build.sh

      - name: Verify release package
        run: ./scripts/verify_release.sh "${{ steps.version.outputs.value }}"

      - name: Generate Homebrew cask
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          DMG="packaging/Pesty-${{ steps.version.outputs.value }}.dmg"
          SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          ./scripts/generate_cask.sh \
            "${{ steps.version.outputs.value }}" \
            "$SHA256" \
            packaging/pesty.rb
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.checksum.outputs.dmg }}" \
            packaging/pesty.rb \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Pesty ${{ steps.version.outputs.value }}" \
            --notes "Pesty ${{ steps.version.outputs.value }}

          SHA-256: \`${{ steps.checksum.outputs.sha256 }}\`

          Universal macOS build for Apple Silicon and Intel, ad-hoc signed and
          verified in GitHub Actions. Install with:

          \`brew install --cask bifrost-proxy/pesty/pesty\`

          This build is not Apple-notarized. The Homebrew cask verifies the
          SHA-256 and removes quarantine after installation."

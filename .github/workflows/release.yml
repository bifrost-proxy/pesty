name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N tag to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Validate release tag and channel
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N: $RELEASE_TAG"
            exit 1
          fi
          git fetch origin main --tags
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Release tag does not exist: $RELEASE_TAG"
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag must point to a commit reachable from origin/main"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-beta.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify localization
        run: swift run Pesty --verify-localization

      - name: Verify history Settings
        run: swift run Pesty --verify-history-settings

      - name: Verify system appearance
        run: swift run Pesty --verify-appearance

      - name: Verify Settings recovery
        run: swift run Pesty --verify-settings-access

      - name: Verify updater contract
        run: swift run Pesty --verify-updater

      - name: Build ad-hoc signed release
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD: ${{ github.run_number }}
        run: ./scripts/release_build.sh

      - name: Verify release package
        run: ./scripts/verify_release.sh "${{ steps.version.outputs.value }}"

      - name: Prepare release assets
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          DMG="packaging/Pesty-${{ steps.version.outputs.value }}.dmg"
          SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          if [[ "${{ steps.version.outputs.prerelease }}" == "false" ]]; then
            ./scripts/generate_cask.sh \
              "${{ steps.version.outputs.value }}" \
              "$SHA256" \
              packaging/pesty.rb
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ARGS=()
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
            RELEASE_ASSETS=("${{ steps.checksum.outputs.dmg }}")
            NOTES="Pesty ${{ steps.version.outputs.value }}

          SHA-256: \`${{ steps.checksum.outputs.sha256 }}\`

          Beta-channel Universal macOS build for Apple Silicon and Intel,
          ad-hoc signed and verified in GitHub Actions. This prerelease is
          offered only to installed Pesty Beta versions. It is not published to
          the stable Homebrew tap."
          else
            RELEASE_ARGS+=(--latest)
            RELEASE_ASSETS=(
              "${{ steps.checksum.outputs.dmg }}"
              packaging/pesty.rb
            )
            NOTES="Pesty ${{ steps.version.outputs.value }}

          SHA-256: \`${{ steps.checksum.outputs.sha256 }}\`

          Universal macOS build for Apple Silicon and Intel, ad-hoc signed and
          verified in GitHub Actions. Install with:

          \`brew install --cask bifrost-proxy/pesty/pesty\`

          This build is not Apple-notarized. The Homebrew cask verifies the
          SHA-256 and removes quarantine after installation."
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            "${RELEASE_ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Pesty ${{ steps.version.outputs.value }}" \
            "${RELEASE_ARGS[@]}" \
            --notes "$NOTES"
